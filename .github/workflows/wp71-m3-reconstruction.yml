name: Independent m3 archive reconstruction

on:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - src/wp71_m3_archive_reconstruction.py
      - .github/workflows/wp71-m3-reconstruction.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u src/wp71_m3_archive_reconstruction.py
