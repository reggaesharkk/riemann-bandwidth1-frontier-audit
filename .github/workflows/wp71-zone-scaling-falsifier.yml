name: Stage-A zone scaling falsifier

on:
  workflow_dispatch:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - .github/workflows/wp71-zone-scaling-falsifier.yml

permissions:
  contents: read

jobs:
  band:
    strategy:
      fail-fast: false
      matrix:
        T: [2400,4800,9600]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
      - name: Run band ledger
        working-directory: upstream/scripts
        run: python -u g1_ledger.py band ${{ matrix.T }} | tee ../../band_${{ matrix.T }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-a-band-${{ matrix.T }}
          path: band_${{ matrix.T }}.log
          if-no-files-found: warn

  cellmean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
      - name: Run low-zone/cellmean ladder
        working-directory: upstream/scripts
        run: python -u g1_ledger.py cellmean | tee ../../cellmean.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-a-cellmean
          path: cellmean.log
          if-no-files-found: warn
