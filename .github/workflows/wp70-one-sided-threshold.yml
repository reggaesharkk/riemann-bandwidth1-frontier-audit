name: One-sided 70 percent threshold

on:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - src/wp70_one_sided_threshold_exact.py
      - .github/workflows/wp70-one-sided-threshold.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact one-sided 70 percent threshold
        run: python -u src/wp70_one_sided_threshold_exact.py
