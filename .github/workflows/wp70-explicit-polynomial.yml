name: Explicit 70 percent polynomial witness

on:
  push:
    branches:
      - research/70pct-support-escape-v0.1
    paths:
      - src/wp70_explicit_polynomial_witness.py
      - .github/workflows/wp70-explicit-polynomial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify explicit polynomial 70 percent witness
        run: python -u src/wp70_explicit_polynomial_witness.py
