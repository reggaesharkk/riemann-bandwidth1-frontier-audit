name: Reconstruct stated paper tail charge

on:
  workflow_dispatch:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - src/wp70_reconstruct_paper_tail.py
      - .github/workflows/wp70-reconstruct-paper-tail.yml

permissions:
  contents: read

jobs:
  reconstruct-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
          test "$(git rev-parse HEAD)" = "d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8"
      - name: Reconstruct T2400
        run: python -u src/wp70_reconstruct_paper_tail.py 2400 | tee reconstruct_tail_2400.log
      - name: Reconstruct T4800
        run: python -u src/wp70_reconstruct_paper_tail.py 4800 | tee reconstruct_tail_4800.log
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-paper-tail
          path: reconstruct_tail_*.log
          if-no-files-found: error
