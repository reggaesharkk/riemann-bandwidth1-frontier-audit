name: Gamma resummation local-factor repair

on:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - src/wp70_gamma_resummation_repair.py
      - .github/workflows/wp70-gamma-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gamma-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
          test "$(git rev-parse HEAD)" = "d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8"
      - name: Replay corrected Euler-local gamma identity
        run: python -u src/wp70_gamma_resummation_repair.py --upstream upstream --D 4000 --J 20000
