name: Exact core limit and 70 percent budget

on:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - src/wp70_exact_core_limit_budget.py
      - .github/workflows/wp70-exact-core-limit-budget.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u src/wp70_exact_core_limit_budget.py
