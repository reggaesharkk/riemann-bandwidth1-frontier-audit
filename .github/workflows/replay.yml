name: baseline replay tests

on:
  push:
    branches: ["research/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate replay report
        run: python src/replay_alpoge_furman.py --output /tmp/replay.json
      - name: Run exact arithmetic and synthetic matrix tests
        run: python -m unittest discover -s tests -v
