name: Reproduce public tail envelope

on:
  workflow_dispatch:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - .github/workflows/reproduce-public-tail-envelope.yml

permissions:
  contents: read

jobs:
  tail-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public reproduction source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
          test "$(git rev-parse HEAD)" = "d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8"
      - name: Partial-sum identity gate
        working-directory: upstream/scripts
        run: python -u tail_bound.py ident | tee ../../tail_ident.log
      - name: Tail envelope T=2400
        working-directory: upstream/scripts
        run: python -u tail_bound.py env 2400 | tee ../../tail_2400.log
      - name: Tail envelope T=4800
        working-directory: upstream/scripts
        run: python -u tail_bound.py env 4800 | tee ../../tail_4800.log
      - uses: actions/upload-artifact@v4
        with:
          name: public-tail-envelope-reproduction
          path: tail_*.log
          if-no-files-found: error
