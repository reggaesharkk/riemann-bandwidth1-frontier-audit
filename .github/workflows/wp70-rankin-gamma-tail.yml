name: Rankin close gamma tail

on:
  workflow_dispatch:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - src/wp70_rankin_gamma_tail.py
      - .github/workflows/wp70-rankin-gamma-tail.yml

permissions:
  contents: read

jobs:
  rankin-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
          test "$(git rev-parse HEAD)" = "d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8"
      - name: Rankin closure T2400
        run: python -u src/wp70_rankin_gamma_tail.py 2400 | tee rankin_tail_2400.log
      - name: Rankin closure T4800
        run: python -u src/wp70_rankin_gamma_tail.py 4800 | tee rankin_tail_4800.log
      - uses: actions/upload-artifact@v4
        with:
          name: rankin-gamma-tail-diagnostic
          path: rankin_tail_*.log
          if-no-files-found: error
