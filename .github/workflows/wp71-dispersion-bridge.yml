name: Reproduce exact dispersion bridge identities

on:
  workflow_dispatch:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - .github/workflows/wp71-dispersion-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
      - name: Run exact swap and bridge gate suite
        working-directory: upstream/scripts
        run: python -u t2_swaps.py | tee ../../dispersion_bridge.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispersion-bridge-replay
          path: dispersion_bridge.log
          if-no-files-found: error
