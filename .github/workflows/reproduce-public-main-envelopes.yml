name: Reproduce public deterministic-main envelopes

on:
  workflow_dispatch:
  push:
    branches:
      - research/frontier-7962-hostile-audit-v0.1
    paths:
      - .github/workflows/reproduce-public-main-envelopes.yml

permissions:
  contents: read

jobs:
  envelopes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Pin public source
        run: |
          git clone --filter=blob:none https://github.com/JoshuaHKU/zeta-0.7947-reproduction.git upstream
          cd upstream
          git checkout d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8
          test "$(git rev-parse HEAD)" = "d85bddfe9d8f12856fba735fc9cb3ca23b48b3a8"
      - name: F-E3b original envelope T2400
        working-directory: upstream/scripts
        run: python -u mains_envelope.py env 2400 | tee ../../main_env_2400.log
      - name: F-E3b original envelope T4800
        working-directory: upstream/scripts
        run: python -u mains_envelope.py env 4800 | tee ../../main_env_4800.log
      - name: F-E3b-prime revised gamma envelope T2400
        working-directory: upstream/scripts
        run: python -u mains_envelope.py env2 2400 | tee ../../main_env2_2400.log
      - name: F-E3b-prime revised gamma envelope T4800
        working-directory: upstream/scripts
        run: python -u mains_envelope.py env2 4800 | tee ../../main_env2_4800.log
      - uses: actions/upload-artifact@v4
        with:
          name: public-main-envelope-reproduction
          path: main_env*.log
          if-no-files-found: error
