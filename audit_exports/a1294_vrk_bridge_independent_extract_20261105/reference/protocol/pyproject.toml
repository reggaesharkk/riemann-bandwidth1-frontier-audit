[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shark-protocol"
version = "1.3.3.dev0"
description = "The Reggae Shark Protocol: 42 unchanged Lean declarations, signed VRK ledger and server-controlled live multi-provider gateway"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Prince Upadhyay", email = "starxshark@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "mpmath>=1.3.0",
  "cryptography>=41.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
shark-protocol = "shark_protocol.cli:main"

[tool.setuptools.packages.find]
include = ["shark_protocol*"]
